; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

; Glob pattern, not a literal filename: PlatformIO only includes files that
; actually match, so this is a no-op (and `pio run` still succeeds cleanly)
; when secrets.local.ini doesn't exist, e.g. in this job's checkout. Copy
; secrets.local.ini.example to secrets.local.ini (gitignored) to supply the
; REBOOT2_HMAC_SECRET and REBOOT2_OTA_PASSWORD build flags for a bench/deploy
; build — see docs/command-loss-timer.md and docs/observability.md for the
; SOPS sourcing.
extra_configs = secrets.local*.ini

; Change the default environment to match your board. Valid options are:
; - arduino_esp32
; - pioarduino_esp32
; - espidf_esp32
; - pioarduino_esp32c3
; - espidf_esp32c3
; - shesp32
; - halmet
; - halser

default_envs = pioarduino_esp32s3

; Secret build flags (REBOOT2_HMAC_SECRET, REBOOT2_OTA_PASSWORD — fixer ADR
; 0055 §4) live in their OWN section, not [env] directly: extra_configs
; merges same-named sections by having the LAST-loaded file's value for a
; given option REPLACE the earlier one, not append to it, so a
; secrets.local.ini with its own `[env] build_flags` would silently drop
; every flag declared above (CORE_DEBUG_LEVEL, USE_ESP_IDF_LOG, etc.) —
; that's a real failure mode, not hypothetical: `pio run` with a populated
; secrets.local.ini fails outright (SensESP's own `#error` on missing
; CORE_DEBUG_LEVEL) without this indirection. Keeping the secret flags in
; `[secrets]`, empty by default and interpolated into [env] build_flags
; below, means secrets.local.ini only ever overrides that one option in a
; section [env] never touches — see secrets.local.ini.example.
[secrets]
build_flags =

[env]

; Options common for all working environments

;; Uncomment and change these if PlatformIO can't auto-detect the ports
;monitor_port = /dev/tty.usbserial-310
;upload_port = /dev/tty.usbserial-310
; Lower the upload speed to 115200 if you have problems with uploading
upload_speed = 115200
monitor_speed = 115200

lib_deps =
    SignalK/SensESP @ ^3.2.2
    ; Add any additional dependencies here

build_flags =
    ; Max (and default) debugging level in Arduino ESP32 Core
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG
     -Ilib/SensESP/src
    ${secrets.build_flags}

; This line defines the partition table to use. "min_spiffs" has two app
; partitions, one for OTA updates and one for the running app, but the
; SPIFFS filesystem is quite small. For 8 MB flash boards such as HALMET,
; you can use "default_8MB.csv" instead.

board_build.partitions = min_spiffs.csv

;; Uncomment the following lines to use Over-the-air (OTA) Updates
upload_protocol = espota
upload_port = 192.168.22.122
upload_flags =
 --auth=transport

; You shouldn't need to touch the settings in this section below this line.

build_unflags =
    -Werror=reorder
monitor_filters = esp32_exception_decoder

test_build_src = true
check_tool = clangtidy
check_flags =
    clangtidy: --fix --format-style=file --config-file=.clang-tidy


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Platform configurations follow

[arduino]

platform = espressif32 @ ^6.9.0
framework = arduino

lib_ignore =
    esp_websocket_client

build_flags =
    ${env.build_flags}
    ; Arduino Core bug workaround: define the log tag for the Arduino
    ; logging macros.
    -D TAG='"Arduino"'

[pioarduino]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

; The library.json format doesn't support dependencies conditional on the
; platform version, so we have to use the lib_deps option to specify the
; esp_websocket_client library only for the ESP-IDF framework.

lib_deps =
    ${env.lib_deps}
    esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413

build_flags =
    ${env.build_flags}

[espidf]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf, arduino

board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

; The library.json format doesn't support dependencies conditional on the
; platform version, so we have to use the lib_deps option to specify the
; esp_websocket_client library only for the ESP-IDF framework.

lib_deps =
    ${env.lib_deps}
    esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413

build_flags =
    ${env.build_flags}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Board configurations follow

[esp32]

board = esp32dev
build_flags =
    ${env.build_flags}
    -D BUTTON_BUILTIN=0
    -D LED_BUILTIN=2

[esp32c3]

board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D SENSESP_BUTTON_PIN=9
    -D PIN_RGB_LED=8
    ; Use the CDC USB port as Serial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[esp32s3]

board = esp32-s3-devkitm-1
board_upload.before_reset = usb_reset
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_flags =
    ${env.build_flags}
    -D SENSESP_BUTTON_PIN=9
    -D PIN_RGB_LED=38
    ; Use the CDC USB port as Serial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Permutations of platform and device.

[env:arduino_esp32]

extends = arduino, esp32
build_flags =
    ${arduino.build_flags}
    ${esp32.build_flags}

[env:pioarduino_esp32]

extends = pioarduino, esp32
build_flags =
    ${pioarduino.build_flags}
    ${esp32.build_flags}

[env:espidf_esp32]

extends = espidf, esp32
build_flags =
    ${espidf.build_flags}
    ${esp32.build_flags}

[env:arduino_esp32c3]

extends = arduino, esp32c3
build_flags =
    ${arduino.build_flags}
    ${esp32c3.build_flags}

[env:pioarduino_esp32s3]

extends = pioarduino, esp32s3
build_flags =
    ${pioarduino.build_flags}
    ${esp32s3.build_flags}

[env:pioarduino_esp32c3]

extends = pioarduino, esp32c3
build_flags =
    ${pioarduino.build_flags}
    ${esp32c3.build_flags}

[env:espidf_esp32c3]

extends = espidf, esp32c3
build_flags =
    ${espidf.build_flags}
    ${esp32c3.build_flags}

[env:arduino_esp32s3]

extends = arduino, esp32s3
build_flags =
    ${arduino.build_flags}
    ${esp32s3.build_flags}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Individual board configurations

[env:shesp32]

extends = pioarduino, esp32
build_flags =
    ${pioarduino.build_flags}
    ${esp32.build_flags}

[env:halmet]

extends = pioarduino, esp32
board_build.partitions = default_8MB.csv

build_flags =
    ${pioarduino.build_flags}
    ${esp32.build_flags}

[env:halser]

extends = pioarduino, esp32c3

build_flags =
    ${pioarduino.build_flags}
    ${esp32c3.build_flags}
